<!DOCTYPE html>
<html>

<head>
  <title>photos - filip płonka</title>
  <link href="../output.css" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .photo-grid {
      position: relative;
    }

    .photo-item {
      position: absolute;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lightbox-content img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
    }

    .lightbox-content img.loading {
      filter: blur(20px);
    }

    .lightbox-spinner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
      z-index: 10;
    }

    .lightbox-spinner.active {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      z-index: 10;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 20px;
      z-index: 10;
    }

    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }

    @media (max-width: 600px) {
      .lightbox-nav { display: none; }
      .photo-item { height: 150px; }
    }

  </style>
</head>

<body class="bg-zinc-100 m-0">
  <div class="p-4 md:p-6">
    <header class="mb-6">
      <h1 class="m-0">photos</h1>
      <p class="mt-4 mb-0">
      photos from my fuji x100vi from newest to oldest. this autosyncs to my icloud photos where i save all decent pictures, so not everything here is exactly brilliant. but there are a few bangers. 
      </p>
    </header>

    <div class="photo-grid" id="gallery">
      <!-- Photos injected by script -->
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navigate(-1)">‹</button>
    <div class="lightbox-content">
      <div class="lightbox-spinner" id="spinner"></div>
      <img id="lightbox-img" src="" alt="">
    </div>
    <button class="lightbox-nav lightbox-next" onclick="navigate(1)">›</button>
  </div>

  <script>
    const photos = PHOTOS_JSON_PLACEHOLDER;

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    let photoElements = [];
    const preloadCache = new Map();

    function preloadImage(index) {
      if (index < 0 || index >= photos.length) return;
      if (preloadCache.has(index)) return;

      const img = new Image();
      img.src = photos[index].full;
      preloadCache.set(index, img);
      img.decode().catch(() => {}); // Decode in background, ignore errors
    }

    function preloadAdjacent(index) {
      preloadImage(index - 1);
      preloadImage(index + 1);
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const containerWidth = gallery.clientWidth;

      const aspectRatios = photos.map(p => p.aspect || 1.5);

      const layout = justifiedLayout(aspectRatios, {
        containerWidth: containerWidth,
        targetRowHeight: 280,
        boxSpacing: 20,
        containerPadding: 0,
      });

      gallery.style.height = layout.containerHeight + 'px';

      // Update existing elements or create new ones
      layout.boxes.forEach((box, i) => {
        let div = photoElements[i];

        if (!div) {
          div = document.createElement('div');
          div.className = 'photo-item';
          div.onclick = () => openLightbox(i);

          const img = document.createElement('img');
          img.src = photos[i].thumb;
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';

          div.appendChild(img);
          gallery.appendChild(div);
          photoElements[i] = div;
        }

        div.style.top = box.top + 'px';
        div.style.left = box.left + 'px';
        div.style.width = box.width + 'px';
        div.style.height = box.height + 'px';
      });
    }

    function init() {
      renderGallery();

      // Re-layout on resize
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(renderGallery, 100);
      });

      // Touch swipe support
      const lightbox = document.getElementById('lightbox');
      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const diff = touchStartX - touchEndX;
      const threshold = 50;
      if (Math.abs(diff) > threshold) {
        if (diff > 0) navigate(1);
        else navigate(-1);
      }
    }

    function openLightbox(index) {
      currentIndex = index;
      loadImage(index);
      preloadAdjacent(index);
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function loadImage(index) {
      const img = document.getElementById('lightbox-img');
      const spinner = document.getElementById('spinner');

      const aspect = photos[index].aspect || 1.5;

      // Calculate dimensions to fit viewport while maintaining aspect ratio
      const maxW = window.innerWidth * 0.95;
      const maxH = window.innerHeight * 0.95;

      let w, h;
      if (maxW / maxH > aspect) {
        // Height constrained
        h = maxH;
        w = h * aspect;
      } else {
        // Width constrained
        w = maxW;
        h = w / aspect;
      }

      img.style.width = w + 'px';
      img.style.height = h + 'px';
      img.src = photos[index].thumb;
      img.classList.add('loading');
      spinner.classList.add('active');

      const fullImg = new Image();
      fullImg.src = photos[index].full;
      fullImg.decode().then(() => {
        img.src = photos[index].full;
        img.classList.remove('loading');
        spinner.classList.remove('active');
      }).catch(() => {
        // Fallback if decode() fails
        img.src = photos[index].full;
        img.classList.remove('loading');
        spinner.classList.remove('active');
      });
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + photos.length) % photos.length;
      loadImage(currentIndex);
      preloadAdjacent(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-content')) {
        closeLightbox();
      }
    });

    // Load justified-layout and init
    import('https://esm.sh/justified-layout@4.1.0').then(module => {
      window.justifiedLayout = module.default;
      init();
    });
  </script>
</body>

</html>
