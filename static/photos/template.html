<!DOCTYPE html>
<html>

<head>
  <title>photos - filip płonka</title>
  <link href="../output.css" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .photo-grid {
      position: relative;
    }

    .photo-item {
      position: absolute;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      z-index: 10;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 20px;
      z-index: 10;
    }

    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }

    @media (max-width: 600px) {
      .lightbox-nav { display: none; }
    }
  </style>
</head>

<body class="bg-zinc-100 m-0">
  <div class="p-4 md:p-6">
    <header class="mb-6">
      <h1 class="m-0">photos</h1>
      <p class="mt-4 mb-0">
      photos from my fuji x100vi from newest to oldest. this autosyncs to my icloud photos where i save all decent pictures, so not everything here is exactly brilliant. but there are a few bangers.
      </p>
    </header>

    <div class="photo-grid" id="gallery"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navigate(-1)">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="navigate(1)">›</button>
  </div>

  <script>
    const photos = PHOTOS_JSON_PLACEHOLDER;

    let currentIndex = 0;
    let touchStartX = 0;
    let wasMultiTouch = false;
    let photoElements = [];

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const containerWidth = gallery.clientWidth;
      const aspectRatios = photos.map(p => p.aspect || 1.5);

      const layout = justifiedLayout(aspectRatios, {
        containerWidth: containerWidth,
        targetRowHeight: 320,
        boxSpacing: 8,
        containerPadding: 0,
      });

      gallery.style.height = layout.containerHeight + 'px';

      layout.boxes.forEach((box, i) => {
        let div = photoElements[i];
        if (!div) {
          div = document.createElement('div');
          div.className = 'photo-item';
          div.onclick = () => openLightbox(i);
          const img = document.createElement('img');
          img.src = photos[i].thumb;
          img.alt = '';
          img.loading = 'lazy';
          div.appendChild(img);
          gallery.appendChild(div);
          photoElements[i] = div;
        }
        div.style.top = box.top + 'px';
        div.style.left = box.left + 'px';
        div.style.width = box.width + 'px';
        div.style.height = box.height + 'px';
      });
    }

    function loadImage(index) {
      const img = document.getElementById('lightbox-img');
      const aspect = photos[index].aspect || 1.5;
      const maxW = window.innerWidth * 0.95;
      const maxH = window.innerHeight * 0.95;
      // Size to fit viewport
      let w, h;
      if (maxW / maxH > aspect) {
        h = maxH; w = h * aspect;
      } else {
        w = maxW; h = w / aspect;
      }
      img.style.width = w + 'px';
      img.style.height = h + 'px';
      // Show thumbnail immediately (stretched to full size)
      img.src = photos[index].thumb;
      // Load full image and swap when ready
      const fullImg = new Image();
      fullImg.src = photos[index].full;
      fullImg.decode().then(() => {
        if (currentIndex === index) img.src = photos[index].full;
      }).catch(() => {
        if (currentIndex === index) img.src = photos[index].full;
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      loadImage(index);
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + photos.length) % photos.length;
      loadImage(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    // Touch swipe
    const lightbox = document.getElementById('lightbox');
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      wasMultiTouch = e.touches.length > 1;
    }, { passive: true });
    lightbox.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) wasMultiTouch = true;
    }, { passive: true });
    lightbox.addEventListener('touchend', (e) => {
      if (wasMultiTouch) return;
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) navigate(diff > 0 ? 1 : -1);
    }, { passive: true });

    import('https://esm.sh/justified-layout@4.1.0').then(module => {
      window.justifiedLayout = module.default;
      renderGallery();
      window.addEventListener('resize', () => renderGallery());
    });
  </script>
</body>

</html>
