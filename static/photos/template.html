<!DOCTYPE html>
<html>

<head>
  <title>photos - filip płonka</title>
  <link href="../output.css" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .photo-grid {
      display: flex;
      flex-wrap: wrap;
    }

    .photo-row {
      display: flex;
      width: 100%;
    }

    .photo-item {
      cursor: pointer;
    }

    .photo-item img {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lightbox-content img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
    }

    .lightbox-content img.loading {
      filter: blur(20px);
    }

    .lightbox-spinner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .lightbox-spinner.active {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      z-index: 10;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 20px;
      z-index: 10;
    }

    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }

    @media (max-width: 600px) {
      .lightbox-nav { display: none; }
      .photo-item { height: 150px; }
    }

  </style>
</head>

<body class="bg-zinc-100 m-0">
  <div class="p-4 md:p-6">
    <header class="mb-6">
      <a href="/" class="text-zinc-500 hover:text-zinc-700">← back</a>
      <h1 class="m-0 mt-2">photos</h1>
    </header>

    <div class="photo-grid" id="gallery">
      <!-- Photos injected by script -->
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navigate(-1)">‹</button>
    <div class="lightbox-content">
      <div class="lightbox-spinner" id="spinner"></div>
      <img id="lightbox-img" src="" alt="">
    </div>
    <button class="lightbox-nav lightbox-next" onclick="navigate(1)">›</button>
  </div>

  <script>
    const photos = PHOTOS_JSON_PLACEHOLDER;

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    const ROW_HEIGHT = 260;
    const MIN_GAP = 4;

    function init() {
      const gallery = document.getElementById('gallery');
      const containerWidth = gallery.clientWidth;

      // Build rows
      const rows = [];
      let currentRow = [];
      let currentRowWidth = 0;

      photos.forEach((photo, i) => {
        const aspect = photo.aspect || 1.5;
        const imgWidth = ROW_HEIGHT * aspect;

        if (currentRowWidth + imgWidth + (currentRow.length * MIN_GAP) > containerWidth && currentRow.length > 0) {
          rows.push(currentRow);
          currentRow = [];
          currentRowWidth = 0;
        }

        currentRow.push({ ...photo, index: i, width: imgWidth });
        currentRowWidth += imgWidth;
      });

      if (currentRow.length > 0) {
        rows.push(currentRow);
      }

      // Calculate horizontal gaps for each row first
      const rowGaps = rows.map((row, rowIndex) => {
        const totalImgWidth = row.reduce((sum, p) => sum + p.width, 0);
        const extraSpace = containerWidth - totalImgWidth;
        const gap = row.length > 1 ? extraSpace / (row.length - 1) : 0;
        const isLastRow = rowIndex === rows.length - 1;
        return (isLastRow && gap > 40) ? MIN_GAP : Math.max(gap, MIN_GAP);
      });

      // Render rows with justified gaps
      rows.forEach((row, rowIndex) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'photo-row';

        const hGap = rowGaps[rowIndex];

        // Vertical gap = average of this row's h-gap and next row's h-gap
        const nextHGap = rowIndex < rows.length - 1 ? rowGaps[rowIndex + 1] : hGap;
        const vGap = (hGap + nextHGap) / 2;
        rowDiv.style.marginBottom = vGap + 'px';

        row.forEach((photo, i) => {
          const div = document.createElement('div');
          div.className = 'photo-item';
          div.style.height = ROW_HEIGHT + 'px';
          div.style.marginRight = (i < row.length - 1) ? hGap + 'px' : '0';
          div.onclick = () => openLightbox(photo.index);

          const img = document.createElement('img');
          img.src = photo.thumb;
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';

          div.appendChild(img);
          rowDiv.appendChild(div);
        });

        gallery.appendChild(rowDiv);
      });

      // Touch swipe support
      const lightbox = document.getElementById('lightbox');
      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const diff = touchStartX - touchEndX;
      const threshold = 50;
      if (Math.abs(diff) > threshold) {
        if (diff > 0) navigate(1);
        else navigate(-1);
      }
    }

    function openLightbox(index) {
      currentIndex = index;
      loadImage(index);
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function loadImage(index) {
      const img = document.getElementById('lightbox-img');
      const spinner = document.getElementById('spinner');

      img.src = photos[index].thumb;
      img.classList.add('loading');
      spinner.classList.add('active');

      const fullImg = new Image();
      fullImg.onload = () => {
        img.src = photos[index].full;
        img.classList.remove('loading');
        spinner.classList.remove('active');
      };
      fullImg.src = photos[index].full;
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + photos.length) % photos.length;
      loadImage(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-content')) {
        closeLightbox();
      }
    });

    init();
  </script>
</body>

</html>
