5b54776a5da8b81c29321c9.r2.dev/thumb/ec1ff8997b32.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/ec1ff8997b32.webp", "aspect": 1.5}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/f0442fa3da23.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/f0442fa3da23.webp", "aspect": 1.5}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/d47ecee4267b.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/d47ecee4267b.webp", "aspect": 1.5}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/5151ef169f92.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/5151ef169f92.webp", "aspect": 0.667}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/986cbe9115e8.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/986cbe9115e8.webp", "aspect": 1.5}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/58c761b6938b.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/58c761b6938b.webp", "aspect": 1.78}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/6b2a69d2da4a.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/6b2a69d2da4a.webp", "aspect": 1.78}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/d546633b7b46.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/d546633b7b46.webp", "aspect": 1.78}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/5d897ba60f7a.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/5d897ba60f7a.webp", "aspect": 1.78}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/79200b3ab21f.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/79200b3ab21f.webp", "aspect": 1.78}, {"thumb": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/thumb/0df2fdea6702.webp", "full": "https://pub-9fffa49765b54776a5da8b81c29321c9.r2.dev/full/0df2fdea6702.webp", "aspect": 1.78}];

    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    const ROW_HEIGHT = 260;
    const MIN_GAP = 4;

    function init() {
      const gallery = document.getElementById('gallery');
      const containerWidth = gallery.clientWidth;

      // Build rows
      const rows = [];
      let currentRow = [];
      let currentRowWidth = 0;

      photos.forEach((photo, i) => {
        const aspect = photo.aspect || 1.5;
        const imgWidth = ROW_HEIGHT * aspect;

        if (currentRowWidth + imgWidth + (currentRow.length * MIN_GAP) > containerWidth && currentRow.length > 0) {
          rows.push(currentRow);
          currentRow = [];
          currentRowWidth = 0;
        }

        currentRow.push({ ...photo, index: i, width: imgWidth });
        currentRowWidth += imgWidth;
      });

      if (currentRow.length > 0) {
        rows.push(currentRow);
      }

      // Calculate horizontal gaps for each row first
      const rowGaps = rows.map((row, rowIndex) => {
        const totalImgWidth = row.reduce((sum, p) => sum + p.width, 0);
        const extraSpace = containerWidth - totalImgWidth;
        const gap = row.length > 1 ? extraSpace / (row.length - 1) : 0;
        const isLastRow = rowIndex === rows.length - 1;
        return (isLastRow && gap > 40) ? MIN_GAP : Math.max(gap, MIN_GAP);
      });

      // Render rows with justified gaps
      rows.forEach((row, rowIndex) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'photo-row';

        const hGap = rowGaps[rowIndex];

        // Vertical gap = average of this row's h-gap and next row's h-gap
        const nextHGap = rowIndex < rows.length - 1 ? rowGaps[rowIndex + 1] : hGap;
        const vGap = (hGap + nextHGap) / 2;
        rowDiv.style.marginBottom = vGap + 'px';

        row.forEach((photo, i) => {
          const div = document.createElement('div');
          div.className = 'photo-item';
          div.style.height = ROW_HEIGHT + 'px';
          div.style.marginRight = (i < row.length - 1) ? hGap + 'px' : '0';
          div.onclick = () => openLightbox(photo.index);

          const img = document.createElement('img');
          img.src = photo.thumb;
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';

          div.appendChild(img);
          rowDiv.appendChild(div);
        });

        gallery.appendChild(rowDiv);
      });

      // Touch swipe support
      const lightbox = document.getElementById('lightbox');
      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const diff = touchStartX - touchEndX;
      const threshold = 50;
      if (Math.abs(diff) > threshold) {
        if (diff > 0) navigate(1);
        else navigate(-1);
      }
    }

    function openLightbox(index) {
      currentIndex = index;
      loadImage(index);
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function loadImage(index) {
      const img = document.getElementById('lightbox-img');
      const spinner = document.getElementById('spinner');

      img.src = photos[index].thumb;
      img.classList.add('loading');
      spinner.classList.add('active');

      const fullImg = new Image();
      fullImg.onload = () => {
        img.src = photos[index].full;
        img.classList.remove('loading');
        spinner.classList.remove('active');
      };
      fullImg.src = photos[index].full;
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + photos.length) % photos.length;
      loadImage(currentIndex);
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-content')) {
        closeLightbox();
      }
    });

    init();
  </script>
